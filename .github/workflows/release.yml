# Builds the Joomla installation package (com_biotime.zip), the Joomla update server file
# (updates.xml) and the Joomla changelog (changelog.xml), and attaches them to GitHub releases.
# Joomla sites find updates through releases/latest/download/updates.xml (see <updateservers> in
# biotime.xml) and the changelog through releases/latest/download/changelog.xml.
#
# - Pull requests and pushes to main: build and check the package, keep it as a workflow artifact.
# - Release published in the GitHub UI (tag v<version>): build from that tag, check that the tag
#   matches the manifest version, and attach com_biotime.zip and updates.xml to the release.
# - Run manually (Actions > Release package > Run workflow): create release v<manifest version>
#   from main with docs/release-notes/<version>.md as notes, and attach both files.
name: Release package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The component on every PHP version it supports: no syntax error, no deprecation notice at
  # compile time, and the tests pass without a deprecation.
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo_pgsql, pdo_sqlite
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Lint (errors and deprecations)
        run: |
          php -v | head -n1
          # The bundled PDF library (administrator/vendor) is third-party code: not linted here.
          out=$(find administrator site script.php -path administrator/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | grep -v '^No syntax errors' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Install test tools
        run: composer install --no-interaction --no-progress --prefer-dist

      # The queries against a real PostgreSQL with ZKBioTime's tables and the portal's read-only
      # user (1.3.7): the runner's own PostgreSQL, which has SSL on. Test passwords only.
      - name: Start PostgreSQL and create the test database
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: pg-admin-test
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "ALTER USER postgres PASSWORD 'pg-admin-test'"
          tests/Support/sql/setup-test-db.sh

      - name: Tests (a deprecation fails them; none may be skipped for lack of PostgreSQL)
        env:
          BIOTIME_TEST_PG: '127.0.0.1:5432:biotime:joomla_portal:portal-pass-123'
          BIOTIME_TEST_PG_ADMIN: '127.0.0.1:5432:biotime:postgres:pg-admin-test'
        run: vendor/bin/phpunit --display-deprecations --fail-on-deprecation --fail-on-skipped

  package:
    # Only once the tests passed on every supported PHP version (1.3.7).
    needs: php
    runs-on: ubuntu-24.04
    # Read-only (1.3.8): this job installs the test tools and runs them, so it gets no token that
    # could write to the repository. The release job below only uploads what was built here.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Read version from manifest
        id: version
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' biotime.xml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Check release tag matches the manifest
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match manifest version $VERSION (expected v$VERSION)."
            exit 1
          fi

      # The component needs PHP 8.3 (script.php): lint and test with that version, not whatever
      # the runner image ships.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0, pinned to the commit: this job may write releases
        with:
          php-version: '8.3'
          extensions: openssl, pdo_pgsql
          coverage: none

      - name: Lint PHP
        run: |
          php -v | head -n1
          find administrator site script.php -path administrator/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install test tools (development only; not part of the package)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run automated tests (fake database; no ZKBioTime server needed)
        run: vendor/bin/phpunit

      # Known vulnerabilities (1.3.7): the test tools, and the bundled PDF library shipped in the package.
      - name: Dependency audit
        run: |
          composer audit --locked --no-interaction
          (cd build/pdf && composer audit --locked --no-interaction)

      - name: Build package
        run: |
          build/build-package.sh
          cp "dist/com_biotime-${{ steps.version.outputs.version }}.zip" dist/com_biotime.zip

      - name: Check package structure
        run: python3 -I build/verify-package.py dist/com_biotime.zip "${{ steps.version.outputs.version }}"

      - name: Write Joomla update file
        run: |
          python3 -I build/make-update-xml.py dist/com_biotime.zip "${{ steps.version.outputs.version }}" dist/updates.xml
          python3 -I -c "import xml.etree.ElementTree as E; E.parse('dist/updates.xml')"

      - name: Write Joomla changelog file
        run: |
          python3 -I build/make-changelog-xml.py CHANGELOG.md dist/changelog.xml
          python3 -I -c "import xml.etree.ElementTree as E, sys; v = E.parse('dist/changelog.xml').getroot()[0].findtext('version'); sys.exit(0 if v == '${{ steps.version.outputs.version }}' else 'changelog.xml starts with ' + str(v) + ', expected the manifest version')"

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: com_biotime-${{ steps.version.outputs.version }}
          path: |
            dist/com_biotime.zip
            dist/updates.xml
            dist/changelog.xml
          if-no-files-found: error

  # Uploads the package built and checked above to a release. The only job that may write to the
  # repository; it runs no code from the repository or its dependencies (1.3.8).
  release:
    needs: package
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the release notes and the changelog are read from the checkout.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Get the package built by the package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: com_biotime-${{ needs.package.outputs.version }}
          path: dist

      - name: Attach package to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/com_biotime.zip dist/updates.xml dist/changelog.xml --clobber --repo "$GITHUB_REPOSITORY"

      - name: Create release with package
        # Releases are made from main only (1.3.7).
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="docs/release-notes/$VERSION.md"
          if [ ! -f "$notes" ]; then
            # Fall back to this version's section of the changelog.
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag exists; replacing its package and update file."
            gh release upload "$tag" dist/com_biotime.zip dist/updates.xml dist/changelog.xml --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/com_biotime.zip dist/updates.xml dist/changelog.xml \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "com_biotime $VERSION" \
              --notes-file "$notes"
          fi
