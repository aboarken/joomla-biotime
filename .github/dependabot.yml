# Dependabot (security): keeps the GitHub Actions the release workflow uses up to date. They are
# pinned to exact commits, so a new version arrives only as a pull request to review, never by
# itself.
#
# The bundled PDF library (administrator/vendor, build/pdf/composer.lock) is not updated here: it
# is refreshed with build/vendor-pdf.sh. Dependabot alerts still report a vulnerable version from
# the lock file (Settings → Code security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  # The test tools (composer.json, development only; not part of the package). The bundled PDF
  # library is refreshed with build/vendor-pdf.sh instead.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # PHPUnit's major versions drop PHP versions the component still supports (PHPUnit 13 needs
    # PHP 8.4; the component supports 8.3), so they are upgraded by hand when the oldest supported
    # PHP allows it. Minor and patch updates, security fixes included, still arrive here.
    ignore:
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
