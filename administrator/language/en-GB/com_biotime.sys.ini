COM_BIOTIME="ZKBioTime"
COM_BIOTIME_XML_DESCRIPTION="Read-only employee self-service attendance portal for ZKTeco ZKBioTime 9.5. ZKBioTime stays the single source of truth; Joomla only reads and displays."
COM_BIOTIME_SUBMENU_SETTINGS="Integration Settings"
COM_BIOTIME_SUBMENU_MAPPINGS="User Mappings"
COM_BIOTIME_SUBMENU_TABLES="Find Tables"

COM_BIOTIME_INSTALL_MIN_PHP="ZKBioTime needs PHP %s or later. Please ask your hosting provider to upgrade PHP."
COM_BIOTIME_INSTALL_MIN_JOOMLA="ZKBioTime needs Joomla %s or later. Please update Joomla first."
COM_BIOTIME_INSTALL_NO_OPENSSL="ZKBioTime needs the PHP OpenSSL extension with AES-256-GCM to encrypt the database password. Please ask your hosting provider to enable it."
COM_BIOTIME_INSTALL_CLEANED_FILES="%d files or folders of removed features were deleted."
COM_BIOTIME_INSTALL_TRASHED_MENU="%d menu items pointing to removed ZKBioTime pages were moved to the trash."
COM_BIOTIME_INSTALL_NEXT_STEPS="ZKBioTime is installed. Next: open Components → ZKBioTime → Integration Settings, enter the connection to ZKBioTime's database and its read-only user, and click Test Database."

COM_BIOTIME_ACCESS_DASHBOARD_VIEW="View My Dashboard"
COM_BIOTIME_ACCESS_DASHBOARD_VIEW_DESC="Allows users in the group to open My Dashboard (their own attendance only)."
COM_BIOTIME_ACCESS_ATTENDANCE_VIEW="View My Attendance"
COM_BIOTIME_ACCESS_ATTENDANCE_VIEW_DESC="Allows users in the group to open My Attendance (their own check-in and check-out times only)."
COM_BIOTIME_ACCESS_CALENDAR_VIEW="View Attendance Calendar"
COM_BIOTIME_ACCESS_CALENDAR_VIEW_DESC="Allows users in the group to open the Attendance Calendar (their own attendance only)."
COM_BIOTIME_ACCESS_PUNCHES_VIEW="View My Punches"
COM_BIOTIME_ACCESS_PUNCHES_VIEW_DESC="Allows users in the group to open My Punches (their own punches only: by fingerprint and face, per device and per month)."
COM_BIOTIME_ACCESS_MANAGER_VIEW="View Manager Dashboard"
COM_BIOTIME_ACCESS_MANAGER_VIEW_DESC="Allows users in the group to open the Manager Dashboard: the attendance of the employees in the departments their own ZKBioTime user may see (all departments for a ZKBioTime superuser or a user who may manage all departments), and in the departments ZKBioTime names them Department Manager of."
COM_BIOTIME_INSTALL_RENAMED_MENU="%d Biometric Devices menu items now open My Punches."

; Menu item types (Menus → Add New Menu Item → ZKBioTime)
COM_BIOTIME_MENU_DASHBOARD="My Dashboard"
COM_BIOTIME_MENU_DASHBOARD_DESC="The logged-in employee's profile, today's check-in and check-out, and the school year's attendance: cards (present, absent, late in, early out, missing punches, average times) and monthly charts."
COM_BIOTIME_MENU_ATTENDANCE="My Attendance"
COM_BIOTIME_MENU_ATTENDANCE_DESC="One row per day: check-in, check-out, the time between them, the devices used and the day's status (Present, Missing Punch, Absent, Weekend)."
COM_BIOTIME_MENU_CALENDAR="Attendance Calendar"
COM_BIOTIME_MENU_CALENDAR_DESC="Monthly calendar with each day's check-in, check-out and status."
COM_BIOTIME_ACCESS_LEAVES_VIEW="View My Leaves"
COM_BIOTIME_ACCESS_LEAVES_VIEW_DESC="Allows users in the group to open My Leaves: their own leave requests from ZKBioTime with each approval stage."
COM_BIOTIME_ACCESS_APPROVALS_VIEW="View My Approvals"
COM_BIOTIME_ACCESS_APPROVALS_VIEW_DESC="Allows users in the group to open My Approvals: the leave requests waiting at a stage they approve in ZKBioTime (by their ZKBioTime approver role), and the stages they decided. Give it to approvers."
COM_BIOTIME_MENU_LEAVES="My Leaves"
COM_BIOTIME_MENU_LEAVES_DESC="The logged-in employee's own leave requests from ZKBioTime: leave type, dates, days, status and every approval stage."
COM_BIOTIME_MENU_APPROVALS="My Approvals"
COM_BIOTIME_MENU_APPROVALS_DESC="For approvers: the leave requests waiting at their stage in ZKBioTime, and the requests they approved or rejected."
COM_BIOTIME_MENU_PUNCHES="My Punches"
COM_BIOTIME_MENU_PUNCHES_DESC="The logged-in employee's own punches: by fingerprint and face, per device and per month, with totals."
COM_BIOTIME_MENU_MANAGER="Manager Dashboard"
COM_BIOTIME_MENU_MANAGER_DESC="For managers: the attendance of everyone in their own department and the departments below it, with department, employee, status and date filters. Needs the View Manager Dashboard permission."
